services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pmuser
      POSTGRES_PASSWORD: pmpassword
      POSTGRES_DB: autonomouspm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmuser -d autonomouspm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: