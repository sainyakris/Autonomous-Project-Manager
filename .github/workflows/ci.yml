name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmuser
          POSTGRES_PASSWORD: pmpassword
          POSTGRES_DB: autonomouspm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmuser -d autonomouspm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throwaway values for CI only. These are not real secrets.
      SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgresql+asyncpg://pmuser:pmpassword@localhost:5432/autonomouspm

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: PGPASSWORD=pmpassword psql -h localhost -U pmuser -d postgres -c "CREATE DATABASE autonomouspm_test;"

      - name: Check migrations apply cleanly
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}